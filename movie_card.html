<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMDB API</title>   
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header class="hero is-primary">
        <div class="content">
            <h1>OMDB API</h1>
        </div>
    </header>
    <section>
        <div class="container">
            <div class="card">
                <div class="card-image">
                    <figure>
                        <img id="movie-poster"
                            src=""
                            alt=""
                        />
                    </figure>
                </div>
                <div class="card-content">
                    <div class="media">
                        <div class="media-content">
                            <p id="movie-title" class="title is-4"></p>
                            <p id="movie-info" class="subtitle is-6"></p>
                            <div id="genres-tags" class="tags"></div>
                            <div class="icon-text">
                                <span class="icon has-text-warning">
                                    <i class="fa-solid fa-star"></i>
                                </span>
                                <span id='span-rating'></span>
                            </div>
                        </div>
                    </div>
                    <div class="content">
                        <p id="movie-released" class="p-card-content"></p>
                        <p id="movie-plot" class="p-card-content"></p>
                        <p id="movie-direction" class="p-card-content"></p>
                        <p id="movie-writer" class="p-card-content"></p>
                        <p id="movie-actors" class="p-card-content"></p>
                        <p id="movie-awards" class="p-card-content"></p>
                    </div>
                </div>  
            </div>

            <form id="opinion-form">
                <h3 class="title is-3">Comparte tu reseña</h3>
                <div class="field">
                    <label class="label">Nombre</label>
                    <div class="control">
                        <input id="nombre" class="input" type="text" placeholder="Nombre">
                    </div>
                </div>

                <div class="rating" role="radiogroup" aria-label="Calificación">
                    <input type="radio" id="star-5" name="rating" value="5">
                    <label for="star-5" aria-label="5 estrellas"><i class="fa-solid fa-star"></i></label>

                    <input type="radio" id="star-4" name="rating" value="4">
                    <label for="star-4" aria-label="4 estrellas"><i class="fa-solid fa-star"></i></label>

                    <input type="radio" id="star-3" name="rating" value="3">
                    <label for="star-3" aria-label="3 estrellas"><i class="fa-solid fa-star"></i></label>

                    <input type="radio" id="star-2" name="rating" value="2">
                    <label for="star-2" aria-label="2 estrellas"><i class="fa-solid fa-star"></i></label>

                    <input type="radio" id="star-1" name="rating" value="1">
                    <label for="star-1" aria-label="1 estrella"><i class="fa-solid fa-star"></i></label>
                </div>

                <div class="field">
                    <label class="label">Escribe aquí tu reseña</label>
                    <div class="control">
                        <textarea id="message" class="textarea" placeholder="Escribe tu reseña"></textarea>
                    </div>
                </div>
                <div class="control">
                    <button id="send-button" class="button is-primary" type="button">
                        <span class="icon is-small is-left">
                            <i class="fa-solid fa-paper-plane"></i>
                        </span>
                        <span>
                            Enviar
                        </span>
                    </button>
                </div>
            </form>
            <div id="div-comment"></div>  
        </div>
    </section>
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
            <strong>OMDB API</strong> por Ana Aparicio.
            </p>
        </div>
    </footer>
    <script src="js/movie_card.js"></script>
    <script src="https://kit.fontawesome.com/deb332e293.js" crossorigin="anonymous"></script>
</body>
</html>
