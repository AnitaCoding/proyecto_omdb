<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMDB API</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bulma@1.0.4/css/bulma.min.css">
    <link rel="stylesheet" href="styles.css">

</head>
<body>
    <header>
        <div class="content">
            <h1>OMDB API</h1>
        </div>
    </header>
    <section>
        <div class="container">
            <div class="field">
                
                <label class="label">Título</label>
                    <p class="control has-icons-left">                   
                        <input id="title-input" class="input" type="text" placeholder="e.g. Spiderman" required>
                        <span class="icon is-small is-left">
                            <i class="fa-solid fa-clapperboard"></i>
                        </span>                          
                    </p>
                <p class="help">*Obligatorio</p>
            </div>

            <div class="field">
                <label class="label">Año</label>
                <p class="control has-icons-left">                   
                    <input id="year-input" class="input" type="email" placeholder="e.g. 2026">
                    <span class="icon is-small is-left">
                        <i class="fa-solid fa-calendar"></i>
                    </span>
                </p>
                <p class="help">*Opcional</p>
            </div>

            <div class="control">
                <button id="search-button" class="button is-primary">
                    <span class="icon is-small is-left">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </span>
                    <span>
                        Buscar
                    </span>
                </button>
            </div>

            <div id="movies-grid">
                <!--Aquí se muestran las películas desde JS-->
            </div>

            <form action="POST" id="opinion-form"></form>
            <div id="div-comment"></div>
        </div>

    </section>
    <footer class="footer">
        <div class="content has-text-centered">
            <p>
            <strong>OMDB API</strong> por Ana Aparicio.
            </p>
        </div>
    </footer>
    <script src="js/app.js"></script>
        <script src="https://kit.fontawesome.com/deb332e293.js" crossorigin="anonymous"></script>

    
</body>
</html>
